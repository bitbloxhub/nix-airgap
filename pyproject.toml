[project]
name = "nix-airgap"
version = "0.1.0"
description = "Transfer Nix closures into air-gapped machines"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
nix-airgap = "airgap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airgap"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]


[tool.ruff.format]
indent-style = "tab"
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "ty>=0.0.71",
]

[tool.ty.rules]
all = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true
